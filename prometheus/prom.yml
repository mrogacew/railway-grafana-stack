global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'wc-typer-backend'
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ['world-cup-typer-backend.railway.internal:8080']